name: Bug report
description: Something in Lumen doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this. The more exact the steps, the faster it gets fixed.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Import a 4K MP4
        2. Put it on the main track and add a cube transition
        3. Export as MP4 at 1080p
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Lumen version
      description: Lumen menu › About.
      placeholder: 1.0.2
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Timeline and editing
        - Playback and sound
        - Import and media
        - Export
        - Projects (save, open, recovery)
        - Copilot / AI tools
        - Transcription and captions
        - Generation (images, video, voice)
        - Blender / HyperFrames / MCP
        - Installer
        - Something else
  - type: input
    id: os
    attributes:
      label: Windows version and GPU
      placeholder: Windows 11 24H2, NVIDIA RTX 4070
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, a small project file, or the Copilot's error message. Please remove anything private (API keys, personal media).
